changelog:
  categories:
    - title: What's New
      labels: ["enhancement", "feature", "feat"]
    - title: Bug Fixes
      labels: ["bug", "fix"]
    - title: Security
      labels: ["security"]
    - title: Performance
      labels: ["performance", "perf"]
    - title: Documentation
      labels: ["documentation", "docs"]
    - title: Dependencies
      labels: ["dependencies"]
    - title: Other Changes
      labels: ["*"]
  exclude:
    labels: ["ignore-for-release", "duplicate", "invalid", "wontfix"]
