name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version to release (e.g. 1.2.0), without the leading v"
        required: true
        type: string

# Least privilege by default; the release job elevates to contents: write.
permissions:
  contents: read

concurrency:
  # Never run two releases for the same ref/version at once.
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Production secrets live in this protected environment.
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ github.event.inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VER="${RAW#v}"
          if ! printf '%s' "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid semantic version '$RAW' (expected MAJOR.MINOR.PATCH)"
            exit 1
          fi
          echo "TAG=v$VER" >> "$GITHUB_ENV"
          # Derive versionName + versionCode deterministically.
          scripts/version.sh "$VER"

      - name: Guard against duplicate version (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git fetch --tags --quiet
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists; refusing to overwrite an existing release."
            exit 1
          fi
          LATEST="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -n "$LATEST" ] && [ "$(printf '%s\n%s\n' "$LATEST" "$TAG" | sort -V | tail -n1)" != "$TAG" ]; then
            echo "::error::Requested ${TAG} is not newer than the latest release ${LATEST}."
            exit 1
          fi

      - name: Create and push tag (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Lockify ${TAG}"
          git push origin "${TAG}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is required for release signing"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/lockify-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Run tests and lint
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --stacktrace

      - name: Build signed release AAB and APK
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Stage, verify and checksum artifacts
        id: stage
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p release
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          AAB_SRC="app/build/outputs/bundle/release/app-release.aab"
          MAP_SRC="app/build/outputs/mapping/release/mapping.txt"
          APK_OUT="release/Lockify-v${VERSION_NAME}-release.apk"
          AAB_OUT="release/Lockify-v${VERSION_NAME}-release.aab"
          cp "$APK_SRC" "$APK_OUT"
          cp "$AAB_SRC" "$AAB_OUT"
          if [ -f "$MAP_SRC" ]; then
            cp "$MAP_SRC" "release/Lockify-v${VERSION_NAME}-mapping.txt"
          fi
          scripts/verify-release.sh \
            --apk "$APK_OUT" --aab "$AAB_OUT" \
            --version "$VERSION_NAME" --code "$VERSION_CODE" \
            --out release
          ls -lah release

      - name: Generate release notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          scripts/generate-changelog.sh "$VERSION_NAME" "${TAG}" > release/RELEASE_NOTES.md
          cat release/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lockify ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          body_path: release/RELEASE_NOTES.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/Lockify-v*-release.apk
            release/Lockify-v*-release.aab
            release/Lockify-v*-SHA256SUMS.txt
            release/Lockify-v*-mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts (workflow retention)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ env.TAG }}
          path: |
            release/Lockify-v*-release.apk
            release/Lockify-v*-release.aab
            release/Lockify-v*-SHA256SUMS.txt
            release/Lockify-v*-mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Delete temporary keystore
        if: always()
        run: |
          if [ -n "${KEYSTORE_FILE:-}" ] && [ -f "${KEYSTORE_FILE}" ]; then
            shred -u "${KEYSTORE_FILE}" || rm -f "${KEYSTORE_FILE}"
          fi
