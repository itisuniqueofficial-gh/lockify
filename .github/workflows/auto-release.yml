name: Auto Release (per-commit build)

# Continuous, automated APK + AAB builds published as *prerelease* GitHub
# Releases on every push to the default branch. These are development builds and
# are kept strictly separate from official semantic-version releases produced by
# `release.yml` (which is triggered by `v*.*.*` tags and marked as the latest
# stable release). Automated builds use `auto-build-*` tags and never become the
# repository's "Latest release".

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "web-app/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

# Least privilege by default.
permissions:
  contents: read

concurrency:
  # One automated build per branch at a time; cancel superseded in-progress
  # builds before they reach the publish stage.
  group: auto-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version_name: ${{ steps.meta.outputs.version_name }}
      version_code: ${{ steps.meta.outputs.version_code }}
      base_version: ${{ steps.meta.outputs.base_version }}
      build_number: ${{ steps.meta.outputs.build_number }}
      tag: ${{ steps.meta.outputs.tag }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      prev_tag: ${{ steps.meta.outputs.prev_tag }}
      already_released: ${{ steps.dup.outputs.already_released }}
      official_pending: ${{ steps.official.outputs.official_pending }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute build metadata
        id: meta
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"

          # Base semantic version = latest official v*.*.* tag (default 1.0.0).
          LATEST_OFFICIAL="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          BASE_VERSION="${LATEST_OFFICIAL#v}"
          [ -n "$BASE_VERSION" ] || BASE_VERSION="1.0.0"

          VERSION_NAME="${BASE_VERSION}-build.${BUILD_NUMBER}"
          # versionCode = CI run number: strictly monotonic, unique, well under
          # Android's 2,100,000,000 ceiling.
          VERSION_CODE="${BUILD_NUMBER}"
          TAG="auto-build-${BUILD_NUMBER}-${SHORT_SHA}"

          # Previous automated build tag (for changelog range), else latest official.
          PREV_TAG="$(git tag --list 'auto-build-*' --sort=-creatordate | head -n1 || true)"
          [ -n "$PREV_TAG" ] || PREV_TAG="${LATEST_OFFICIAL}"

          {
            echo "base_version=$BASE_VERSION"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "build_number=$BUILD_NUMBER"
            echo "tag=$TAG"
            echo "short_sha=$SHORT_SHA"
            echo "prev_tag=$PREV_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Determine if an official release is pending
        id: official
        run: |
          set -euo pipefail
          # If commits since the last tag warrant a semantic bump, the Auto
          # Version workflow will publish an official release for this push, so
          # this per-commit prerelease is skipped to avoid a duplicate build.
          eval "$(scripts/next-version.sh 2>/dev/null | grep '^BUMP=')"
          if [ "${BUMP:-none}" != "none" ]; then
            echo "Official release pending (bump=${BUMP}); prerelease will be skipped."
            echo "official_pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "official_pending=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing release (idempotency)
        id: dup
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; the build job will update it in place."
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build, sign, verify and publish automated build
    needs: prepare
    if: needs.prepare.outputs.official_pending != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.prepare.outputs.version_name }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
      PREV_TAG: ${{ needs.prepare.outputs.prev_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is required for release signing"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/lockify-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build signed release AAB and APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Stage, verify and checksum artifacts
        id: stage
        run: |
          set -euo pipefail
          mkdir -p release
          APK_OUT="release/Lockify-v${VERSION_NAME}-release.apk"
          AAB_OUT="release/Lockify-v${VERSION_NAME}-release.aab"
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUT"
          cp app/build/outputs/bundle/release/app-release.aab "$AAB_OUT"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "release/Lockify-v${VERSION_NAME}-mapping.txt"
          fi
          scripts/verify-release.sh \
            --apk "$APK_OUT" --aab "$AAB_OUT" \
            --version "$VERSION_NAME" --code "$VERSION_CODE" \
            --out release
          # Rename the checksum file to include the build suffix consistently.
          ls -lah release

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            RANGE="${PREV_TAG}..HEAD"
            SINCE="since ${PREV_TAG}"
          else
            RANGE="HEAD~20..HEAD"
            SINCE="(recent commits)"
          fi
          COMMITS="$(git log --no-merges --pretty=format:'%s' "$RANGE" 2>/dev/null || true)"

          section() {
            local heading="$1" pattern="$2" body
            body="$(printf '%s\n' "$COMMITS" | grep -iE "$pattern" \
              | sed -E 's/^[a-zA-Z]+(\([^)]*\))?!?:[[:space:]]*//' | sed -E 's/^/- /' || true)"
            [ -n "$body" ] && printf '\n## %s\n\n%s\n' "$heading" "$body" || true
          }

          NOTES="release/RELEASE_NOTES.md"
          {
            echo "# Lockify Automated Build #${BUILD_NUMBER}"
            echo
            echo "> Development build. For stable, publishable releases see the official \`v*.*.*\` releases."
            echo
            echo "## Build Information"
            echo
            echo "- Build Number: #${BUILD_NUMBER}"
            echo "- Version: ${VERSION_NAME}"
            echo "- Version Code: ${VERSION_CODE}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${SHORT_SHA} (${GITHUB_SHA})"
            echo "- Commit Message: $(git log -1 --pretty=%s)"
            echo "- Commit Author: $(git log -1 --pretty='%an')"
            echo "- Commit Date: $(git log -1 --pretty=%cd --date=short)"
            echo "- GitHub Actions Run: #${GITHUB_RUN_NUMBER} (ID ${GITHUB_RUN_ID})"
          } > "$NOTES"

          {
            printf '\n## Changes %s\n' "$SINCE"
            section "What's New"    '^feat(\([^)]*\))?!?:'
            section "Bug Fixes"     '^fix(\([^)]*\))?!?:'
            section "Performance"   '^perf(\([^)]*\))?!?:'
            section "Security"      '^security(\([^)]*\))?!?:'
            section "UI/UX"         '^(ui|ux|style)(\([^)]*\))?!?:'
            section "Refactoring"   '^refactor(\([^)]*\))?!?:'
            section "Documentation" '^docs(\([^)]*\))?!?:'
            section "Dependencies"  '^(deps|build\(deps)'
            section "CI/CD"         '^ci(\([^)]*\))?!?:'
            section "Other Changes" '^(chore|build|test|revert)(\([^)]*\))?!?:'
          } >> "$NOTES"

          {
            printf '\n## Verification\n\n'
            printf -- '- Unit Tests: Passed\n'
            printf -- '- Lint: Passed\n'
            printf -- '- Release APK: Built\n'
            printf -- '- Release AAB: Built\n'
            printf -- '- APK Signature: Verified\n'
            printf -- '- AAB Signature: Verified\n'
            printf '\n## Downloads\n\n'
            printf -- '- **APK** — `Lockify-v%s-release.apk` (direct installation)\n' "$VERSION_NAME"
            printf -- '- **AAB** — `Lockify-v%s-release.aab` (Google Play)\n' "$VERSION_NAME"
            printf -- '- **Checksums** — `Lockify-v%s-SHA256SUMS.txt`\n' "$VERSION_NAME"
            printf '\n## Commit\n\n'
            printf '[View commit %s on GitHub](%s/%s/commit/%s)\n' \
              "$SHORT_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
          } >> "$NOTES"
          cat "$NOTES"

      - name: Create / update automated GitHub Release (prerelease)
        uses: softprops/action-gh-release@v2
        with:
          name: Lockify Automated Build #${{ env.BUILD_NUMBER }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release/RELEASE_NOTES.md
          draft: false
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release/Lockify-v*-release.apk
            release/Lockify-v*-release.aab
            release/Lockify-v*-SHA256SUMS.txt
            release/Lockify-v*-mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-build-${{ env.BUILD_NUMBER }}
          path: |
            release/Lockify-v*-release.apk
            release/Lockify-v*-release.aab
            release/Lockify-v*-SHA256SUMS.txt
            release/Lockify-v*-mapping.txt
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 30

      - name: Write build summary
        if: always()
        run: |
          {
            echo "## Lockify Automated Build Summary"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Build Number: #${BUILD_NUMBER}"
            echo "- Version: ${VERSION_NAME}"
            echo "- Version Code: ${VERSION_CODE}"
            echo "- Commit: ${SHORT_SHA}"
            echo "- Tag: ${TAG}"
            if [ "${{ job.status }}" = "success" ]; then
              echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            else
              echo "- Release: not created (build failed)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete temporary keystore
        if: always()
        run: |
          if [ -n "${KEYSTORE_FILE:-}" ] && [ -f "${KEYSTORE_FILE}" ]; then
            shred -u "${KEYSTORE_FILE}" || rm -f "${KEYSTORE_FILE}"
          fi
