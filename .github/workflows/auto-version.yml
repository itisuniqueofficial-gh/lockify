name: Auto Version & Official Release

# On every push to the default branch, calculate the next semantic version from
# Conventional Commits since the last tag. When a release is warranted
# (feat/fix/perf/security/breaking), build and sign the release APK + AAB,
# enforce strict version consistency, update the changelog, create the tag, and
# publish the official "Lockify vX.Y.Z" release (marked as latest).
#
# Docs/chore/ci-only pushes do NOT create an official release.
#
# Recursion safety: the changelog commit and the tag are pushed with the default
# GITHUB_TOKEN, which by design does NOT trigger further workflow runs, so this
# workflow never re-triggers itself or the tag-based release.yml.

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "web-app/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      force_bump:
        description: "Force a specific bump (leave empty to auto-detect)"
        required: false
        type: choice
        default: ""
        options: ["", "patch", "minor", "major"]

permissions:
  contents: read

concurrency:
  group: auto-version-${{ github.ref }}
  # Never cancel once a release may be publishing.
  cancel-in-progress: false

jobs:
  plan:
    name: Determine next version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      bump: ${{ steps.calc.outputs.BUMP }}
      version: ${{ steps.calc.outputs.NEXT_VERSION }}
      tag: ${{ steps.calc.outputs.NEXT_TAG }}
      version_code: ${{ steps.calc.outputs.VERSION_CODE }}
      should_release: ${{ steps.decide.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version
        id: calc
        run: |
          if [ -n "${{ github.event.inputs.force_bump }}" ]; then
            scripts/next-version.sh --force "${{ github.event.inputs.force_bump }}"
          else
            scripts/next-version.sh
          fi

      - name: Decide whether to release
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ steps.calc.outputs.BUMP }}
          NEXT_TAG: ${{ steps.calc.outputs.NEXT_TAG }}
        run: |
          set -euo pipefail
          if [ "$BUMP" = "none" ]; then
            echo "No releasable commits since last tag; skipping official release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git rev-parse "refs/tags/$NEXT_TAG" >/dev/null 2>&1 \
             || gh release view "$NEXT_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::warning::$NEXT_TAG already exists; skipping to avoid a duplicate release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "should_release=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build, verify and publish official release
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: write
    env:
      VERSION_NAME: ${{ needs.plan.outputs.version }}
      VERSION_CODE: ${{ needs.plan.outputs.version_code }}
      TAG: ${{ needs.plan.outputs.tag }}
      BUMP: ${{ needs.plan.outputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name secret is required"; missing=1; fi
          done
          [ "$missing" -eq 0 ]

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          keystore_path="$RUNNER_TEMP/lockify-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon --stacktrace

      - name: Build signed release AAB and APK
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Stage, verify and checksum artifacts
        run: |
          set -euo pipefail
          mkdir -p release
          APK_OUT="release/Lockify-v${VERSION_NAME}.apk"
          AAB_OUT="release/Lockify-v${VERSION_NAME}.aab"
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUT"
          cp app/build/outputs/bundle/release/app-release.aab "$AAB_OUT"
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt "release/Lockify-v${VERSION_NAME}-mapping.txt"
          fi
          scripts/verify-release.sh \
            --apk "$APK_OUT" --aab "$AAB_OUT" \
            --version "$VERSION_NAME" --code "$VERSION_CODE" --out release

      - name: Enforce version consistency
        run: |
          set -euo pipefail
          # By construction the tag, title, filenames and injected version all
          # derive from a single value; assert it explicitly per policy.
          [ "$TAG" = "v$VERSION_NAME" ] || { echo "::error::tag $TAG != v$VERSION_NAME"; exit 1; }
          [ -f "release/Lockify-v${VERSION_NAME}.apk" ] || { echo "::error::APK name mismatch"; exit 1; }
          [ -f "release/Lockify-v${VERSION_NAME}.aab" ] || { echo "::error::AAB name mismatch"; exit 1; }
          echo "Version consistency OK: tag=$TAG version=$VERSION_NAME code=$VERSION_CODE"

      - name: Update CHANGELOG.md
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          PREV_TAG="$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1 || true)"
          if [ -n "$PREV_TAG" ] && git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD"
          fi
          COMMITS="$(git log --no-merges --pretty=format:'%s' "$RANGE" 2>/dev/null || true)"
          sect() {
            local h="$1" p="$2" b
            b="$(printf '%s\n' "$COMMITS" | grep -iE "$p" \
              | sed -E 's/^[a-zA-Z]+(\([^)]*\))?!?:[[:space:]]*//' | sed -E 's/^/- /' || true)"
            [ -n "$b" ] && printf '\n### %s\n\n%s\n' "$h" "$b" || true
          }
          {
            printf '## Lockify v%s — %s\n' "$VERSION_NAME" "$DATE"
            sect "Added"    '^feat(\([^)]*\))?!?:'
            sect "Fixed"    '^fix(\([^)]*\))?!?:'
            sect "Performance" '^perf(\([^)]*\))?!?:'
            sect "Security" '^security(\([^)]*\))?!?:'
            sect "Changed"  '^(refactor|build|ci|chore|style|test)(\([^)]*\))?!?:'
            printf '\n'
          } > /tmp/section.md

          if [ -f CHANGELOG.md ]; then
            # Insert the new section after the first "# Changelog" heading.
            awk 'NR==1 && /^# /{print; print ""; while((getline line < "/tmp/section.md")>0) print line; next} {print}' \
              CHANGELOG.md > /tmp/CHANGELOG.new || cat /tmp/section.md CHANGELOG.md > /tmp/CHANGELOG.new
            mv /tmp/CHANGELOG.new CHANGELOG.md
          else
            { printf '# Changelog\n\n'; cat /tmp/section.md; } > CHANGELOG.md
          fi
          cp /tmp/section.md release/RELEASE_SECTION.md

      - name: Generate release notes
        run: |
          set -euo pipefail
          NOTES="release/RELEASE_NOTES.md"
          {
            printf '# Lockify v%s\n\n' "$VERSION_NAME"
            sed -E 's/^### /## /' release/RELEASE_SECTION.md
            printf '\n## 🧪 Verification\n\n'
            printf -- '- Unit Tests: ✅\n- Lint: ✅\n- Release APK: ✅\n- Release AAB: ✅\n'
            printf -- '- APK Signature: ✅\n- AAB Signature: ✅\n'
            printf '\n## 📱 Downloads\n\n'
            printf -- '- `Lockify-v%s.apk` — direct Android installation\n' "$VERSION_NAME"
            printf -- '- `Lockify-v%s.aab` — Google Play publishing\n' "$VERSION_NAME"
            printf -- '- `Lockify-v%s-SHA256SUMS.txt` — checksums\n' "$VERSION_NAME"
            printf '\n## 🔗 Commit\n\n%s/%s/commit/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            printf '\n## 📅 Release Date\n\n%s\n' "$(date -u +%Y-%m-%d)"
          } > "$NOTES"
          cat "$NOTES"

      - name: Commit changelog and create tag
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): Lockify ${TAG} [skip ci]" || echo "No changelog changes to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git tag -a "${TAG}" -m "Lockify ${TAG}"
          git push origin "${TAG}"

      - name: Create official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Lockify ${{ env.TAG }}
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          body_path: release/RELEASE_NOTES.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release/Lockify-v*.apk
            release/Lockify-v*.aab
            release/Lockify-v*-SHA256SUMS.txt
            release/Lockify-v*-mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: official-release-${{ env.TAG }}
          path: |
            release/Lockify-v*.apk
            release/Lockify-v*.aab
            release/Lockify-v*-SHA256SUMS.txt
            release/Lockify-v*-mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Lockify Official Release"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Version: ${VERSION_NAME} (bump: ${BUMP})"
            echo "- Version Code: ${VERSION_CODE}"
            echo "- Tag: ${TAG}"
            if [ "${{ job.status }}" = "success" ]; then
              echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete temporary keystore
        if: always()
        run: |
          if [ -n "${KEYSTORE_FILE:-}" ] && [ -f "${KEYSTORE_FILE}" ]; then
            shred -u "${KEYSTORE_FILE}" || rm -f "${KEYSTORE_FILE}"
          fi
